name: CaseBattle APK v6

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="CaseBattle-Stable-v6.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE in repository root"; ls -la; exit 1; }
          rm -rf _android_project
          mkdir _android_project
          unzip -q "$ARCHIVE" -d _android_project
          test -f _android_project/settings.gradle || { echo "settings.gradle missing"; find _android_project -maxdepth 3 -type f -print; exit 1; }
          test -f _android_project/build.gradle || { echo "build.gradle missing"; exit 1; }
          test -f _android_project/app/build.gradle || { echo "app/build.gradle missing"; exit 1; }
          echo "Project extracted successfully"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: _android_project
        shell: bash
        run: |
          set +e
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "### Android build failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            LAST_ERROR=$(grep -E "(^e: |FAILURE:|Execution failed for task|Could not resolve|requires libraries and applications that depend on it to compile against|What went wrong)" build.log | tail -n 1 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            if [ -z "$LAST_ERROR" ]; then LAST_ERROR="Gradle assembleDebug failed. Open the job summary or build-log artifact."; fi
            echo "::error title=Android build failed::$LAST_ERROR"
            exit "$STATUS"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CaseBattle-v6-build-log
          path: _android_project/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CaseBattle-v6-debug-apk
          path: _android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
