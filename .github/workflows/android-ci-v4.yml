name: Android APK v4

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="CaseBattle-Rebuild-v4.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE in repository root"; ls -la; exit 1; }
          rm -rf _android_project
          mkdir _android_project
          unzip -q "$ARCHIVE" -d _android_project
          test -f _android_project/settings.gradle.kts || { echo "settings.gradle.kts not found after extraction"; find _android_project -maxdepth 3 -type f -print; exit 1; }
          test -f _android_project/build.gradle.kts || { echo "build.gradle.kts not found after extraction"; exit 1; }
          test -f _android_project/app/build.gradle.kts || { echo "app/build.gradle.kts not found after extraction"; exit 1; }
          echo "Android project structure OK"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Gradle project
        working-directory: _android_project
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace projects

      - name: Build debug APK
        working-directory: _android_project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CaseBattle-Rebuild-v4-debug
          path: _android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
